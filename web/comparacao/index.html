<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070c40">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<link rel="stylesheet" href="/shared/responsive.css?v=20260818-comparison-v1">
  <link rel="stylesheet" href="/shared/brand-system.css?v=20260818-comparison-v1">
  <link rel="stylesheet" href="./styles.css?v=20260818-comparison-v1">
  <title>Comparação de Planos | Novo Horizonte</title>
  <link rel="icon" type="image/png" href="/assets/simbolo-fundo-azul.png" />
  <link rel="shortcut icon" type="image/png" href="/assets/simbolo-fundo-azul.png" />
  <link rel="apple-touch-icon" href="/assets/simbolo-fundo-azul.png" />
  <meta property="og:image" content="https://nhprotecao.com.br/assets/simbolo-fundo-azul.png" />
  <meta property="og:image:type" content="image/png" />
  <meta name="twitter:image" content="https://nhprotecao.com.br/assets/simbolo-fundo-azul.png" />
</head>
<body>
  <header class="topbar">
    <img src="/assets/logo-nh-oficial.png" alt="Novo Horizonte Proteção Veicular">
    <span>Comparação de planos</span>
  </header>

  <main class="page-shell">
    <section class="hero-card">
      <span class="eyebrow">PROTEÇÃO VEICULAR</span>
      <h1>Escolha seu plano e personalize com adicionais</h1>
      <p id="intro-text">Carregando sua comparação...</p>
      <div id="vehicle-summary" class="vehicle-summary"></div>
    </section>

    <div id="error-box" class="error-box" hidden></div>

    <section id="comparison-content" hidden>
      <div class="section-title">
        <span class="eyebrow">PLANOS DISPONÍVEIS</span>
        <h2>Compare os valores</h2>
        <p>Escolha um plano e marque os adicionais para ver o valor atualizado na hora.</p>
      </div>
      <div id="plan-list" class="plan-list"></div>
    </section>
  </main>

  <div id="sticky-choice" class="sticky-choice" hidden>
    <div>
      <small>Sua escolha</small>
      <strong id="sticky-plan">Selecione um plano</strong>
      <span id="sticky-total">—</span>
    </div>
    <button id="send-choice" type="button" disabled>Escolher este plano e enviar ao consultor</button>
  </div>

  <script src="/shared/config.js"></script>
  <script src="./app.js?v=20260818-consultant-return-v1"></script>
</body>
</html>
