name: nh-plataforma
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      TZ: America/Maceio
    volumes:
      - nh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PUBLIC_API_URL: https://${WWW_DOMAIN}
      PUBLIC_WEB_URL: https://${WWW_DOMAIN}
      ALLOWED_ORIGINS: https://${DOMAIN},https://${WWW_DOMAIN}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Defina AUTH_TOKEN_SECRET}
      AUTH_TOKEN_HOURS: ${AUTH_TOKEN_HOURS:-12}
      CONSULTANT_USERNAME: ${CONSULTANT_USERNAME:?Defina CONSULTANT_USERNAME}
      CONSULTANT_PASSWORD: ${CONSULTANT_PASSWORD:?Defina CONSULTANT_PASSWORD}
      ANALYST_USERNAME: ${ANALYST_USERNAME:-analista}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:-nh2027}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Defina ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      TEAM_WHATSAPP_NUMBER: ${TEAM_WHATSAPP_NUMBER:-}
      TEAM_EMAIL: ${TEAM_EMAIL:-}
      WHATSAPP_CLOUD_ENABLED: ${WHATSAPP_CLOUD_ENABLED:-false}
      WHATSAPP_CLOUD_API_VERSION: ${WHATSAPP_CLOUD_API_VERSION:-v23.0}
      WHATSAPP_CLOUD_PHONE_NUMBER_ID: ${WHATSAPP_CLOUD_PHONE_NUMBER_ID:-}
      WHATSAPP_CLOUD_ACCESS_TOKEN: ${WHATSAPP_CLOUD_ACCESS_TOKEN:-}
      WHATSAPP_COMPLETION_TEMPLATE_NAME: ${WHATSAPP_COMPLETION_TEMPLATE_NAME:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-pt_BR}
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-false}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_DRIVE_OAUTH_CLIENT_ID: ${GOOGLE_DRIVE_OAUTH_CLIENT_ID:-}
      GOOGLE_DRIVE_OAUTH_CLIENT_SECRET: ${GOOGLE_DRIVE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN: ${GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_CREDENTIALS_BASE64: ${GOOGLE_DRIVE_CREDENTIALS_BASE64:-}
      GOOGLE_DRIVE_PUBLIC_LINKS: ${GOOGLE_DRIVE_PUBLIC_LINKS:-false}
      GOOGLE_DRIVE_TEAM_EMAILS: ${GOOGLE_DRIVE_TEAM_EMAILS:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0 -Dfile.encoding=UTF-8 -Duser.timezone=America/Maceio
      TZ: America/Maceio
    depends_on:
      database:
        condition: service_healthy
    expose: ["8080"]
    networks: [internal]

  hinova-api:
    build: ./hinova-api
    restart: unless-stopped
    environment:
      PORT: 3001
      HINOVA_API_BASE_URL: ${HINOVA_API_BASE_URL:-https://api.hinova.com.br/api/sga/v2}
      HINOVA_API_TOKEN: ${HINOVA_API_TOKEN:-}
      HINOVA_API_USER: ${HINOVA_API_USER:-}
      HINOVA_API_PASSWORD: ${HINOVA_API_PASSWORD:-}
      HINOVA_API_USER_TOKEN: ${HINOVA_API_USER_TOKEN:-}
      HINOVA_ASSOCIADO_CPF_PATH: ${HINOVA_ASSOCIADO_CPF_PATH:-}
      HINOVA_ASSOCIADO_DEFAULT_PASSWORD: ${HINOVA_ASSOCIADO_DEFAULT_PASSWORD:-}
      BOLETO_MAX_DAYS_AFTER_DUE: ${BOLETO_MAX_DAYS_AFTER_DUE:-6}
      BOLETO_SEARCH_DAYS_PAST: ${BOLETO_SEARCH_DAYS_PAST:-180}
      BOLETO_SEARCH_DAYS_FUTURE: ${BOLETO_SEARCH_DAYS_FUTURE:-420}
    expose: ["3001"]
    networks: [internal]

  web:
    build: ./web
    restart: unless-stopped
    environment:
      SGA_URL: ${SGA_URL:-https://sga.hinova.com.br/sga/sgav4_novohorizonte/v5/login.php}
      TEAM_WHATSAPP_NUMBER: ${TEAM_WHATSAPP_NUMBER:-}
    depends_on: [backend, hinova-api]
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN:?Defina WWW_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Defina LETSENCRYPT_EMAIL}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/kinghost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal:
    driver: bridge
volumes:
  nh_postgres_data:
  caddy_data:
  caddy_config:
